\f0\fs24 \cf0 services:\
  - type: web\
    name: ecosentia\
    runtime: python\
    plan: free\
    buildCommand: pip install -r requirements.txt\
    # A single worker with two threads. The workload is I/O-bound on two\
    # external APIs, and NCBI's rate limit is enforced per process, so extra\
    # workers would each keep their own pacing state and exceed the quota.\
    startCommand: gunicorn app:app --workers 1 --threads 2 --timeout 120 --bind 0.0.0.0:$PORT\
    envVars:\
      - key: PYTHON_VERSION\
        value: "3.11.9"\
      - key: ECOSENTIA_CONTACT\
        sync: false\
      - key: NCBI_API_KEY\
        sync: false\
      - key: ECOSENTIA_TIMEOUT\
        value: "20"\
      - key: ECOSENTIA_MAX_RECORDS\
        value: "100"}