services:
  - type: web
    name: ecosentia-checkpoint
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    # Render marks the deploy live only once this path answers 200. Without it,
    # "Your service is live" means the container started, not that it is reachable.
    healthCheckPath: /api/health
    envVars:
      - key: ECOSENTIA_CONTACT
        sync: false
      - key: NCBI_API_KEY
        sync: false
      - key: ECOSENTIA_TIMEOUT
        value: "20"
      - key: ECOSENTIA_MAX_RECORDS
        value: "100"
